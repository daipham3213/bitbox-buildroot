name: makefile build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap v86-buildroot
        run: make bootstrap

      - name: Configure Buildroot
        run: make buildroot-defconfig

      - name: Build Buildroot
        run: make all

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-v86-release
          path: |
            build/*/images/
